name: Build and Push Eagapps Image
on:
  workflow_dispatch:
    inputs:
      frappe-branch:
        type: choice
        description: "Frappe branch against which to build the image. Basically, the version of Frappe to use"
        required: false
        default: "version-16"
        options:
          - version-16
          - version-15
      image-tag:
        type: choice
        description: "Tag to push the image with"
        required: false
        default: "latest"
        options:
          - latest
          - latest-frappe-15
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eagapps
  PYTHON_VERSION: 3.14
  APPS_JSON_PATH: ./frappe_docker/apps.json

jobs:
  push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup app.json
        run: |
          cat > ${{ env.APPS_JSON_PATH }} <<EOF
          [
            {
              "url": "${{ secrets.EAGAPPS_URL }}",
              "branch": "${{ secrets.EAGAPPS_BRANCH }}"
            }
          ]
          EOF

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/custom/Containerfile
          push: true
          tags: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}
          build-args: |
            FRAPPE_PATH: https://github.com/frappe/frappe
            FRAPPE_BRANCH: ${{ inputs.frappe-branch}}
            PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          secret-files: |
            apps_json=${{ env.APPS_JSON_PATH }}

      - name: Remove apps.json
        if: "${{ always() }}"
        run: rm ${{ env.APPS_JSON_PATH }}
